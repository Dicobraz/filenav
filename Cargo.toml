[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Anton Antropov"]
repository = "https://github.com/Dicobraz/filenav"

[workspace.dependencies]
# Крейты workspace. Рёбра между ними заводит задача, которая начинает их использовать.
filenav-core = { path = "crates/core", version = "0.1.0" }
filenav-vfs = { path = "crates/vfs", version = "0.1.0" }
filenav-ops = { path = "crates/ops", version = "0.1.0" }
filenav-term = { path = "crates/term", version = "0.1.0" }
filenav-keymap = { path = "crates/keymap", version = "0.1.0" }
filenav-view = { path = "crates/view", version = "0.1.0" }
filenav-ui = { path = "crates/ui", version = "0.1.0" }
filenav-i18n = { path = "crates/i18n", version = "0.1.0" }
filenav-search = { path = "crates/search", version = "0.1.0" }
filenav-arc = { path = "crates/arc", version = "0.1.0" }
filenav-testdata = { path = "crates/testdata" }

# Внешние зависимости (S1 §3).
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
# Рендер — wgpu (ADR-0012); бэкенды wgpu выбирает app по ОС.
eframe = { version = "0.36.2", default-features = false, features = ["wgpu_no_default_features", "default_fonts", "x11", "wayland"] }
crossbeam-channel = "0.5.17"
rayon = "1.12"
compact_str = { version = "0.10", features = ["serde"] }
smallvec = { version = "1.16", features = ["serde", "union", "const_generics"] }
rustc-hash = "2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1"
dirs = "7.0"
thiserror = "2.0"
anyhow = "1.0"
# Уже в графе через dirs и tracing-subscriber; features — в крейтах.
raw-window-handle = "0.6.2"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl"] }
windows-sys = "0.61"
# Без `attributes` (#[instrument]): тянет syn 2 рядом с syn 3. Спаны — через `*_span!`.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
# i18n (S2 §8; решение владельца 2026-10-17 — sys-locale, jiff).
fluent-bundle = "0.16"
unic-langid = "0.9.6"
sys-locale = "0.3.2"
jiff = "0.2.38"

# Только dev.
proptest = "1.12"
tempfile = "3.27"
insta = { version = "1.49", features = ["toml"] }
criterion = "0.8"

[workspace.lints.rust]
# `#[allow(unsafe_code)]` получают только модули `sys` в vfs, ops, term, ui, view, app (S0 v4 №1, v5 №5).
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "unwind"

# Быстрый egui в debug.
[profile.dev.package."*"]
opt-level = 2

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
