name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited — чтобы правка заголовка PR перезапускала его проверку.
    types: [opened, synchronize, reopened, edited]
  # Очередь мержа (merge queue): GitHub сам ставит PR поверх main и гоняет CI.
  merge_group:

# Новый прогон отменяет старый для той же ветки. Правка заголовка (edited) идёт
# в отдельной группе и не отменяет сборку.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && 'title' || 'build' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $re ]]; then
            echo "OK: $TITLE"
          else
            echo "::error::Заголовок PR не в формате Conventional Commits: 'type(scope)?: описание', например 'feat(core): base types'. Получено: '$TITLE'"
            exit 1
          fi

  fmt:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  deny:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  # Только Windows (решение владельца 2026-10-20): Linux и macOS не собираются и не
  # тестируются. fmt, deny и заголовок PR — на ubuntu: приложение там не собирается.
  test:
    if: github.event.action != 'edited'
    name: test (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      # Ставит тулчейн из rust-toolchain.toml (rustup ≥1.28 не делает этого в `rustup show`).
      - run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-nextest
      - name: Python
        run: echo "PY=$(command -v python3 || command -v python)" >> "$GITHUB_ENV"
      # Каталог сборки — из cargo metadata, не `target/` (H-01: CARGO_TARGET_DIR может быть общим).
      - name: Target dir
        run: |
          T=$(cargo metadata --format-version 1 --no-deps | "$PY" -c 'import json,sys; print(json.load(sys.stdin)["target_directory"].replace("\\", "/"))')
          echo "BIN=$T/release/urfin.exe" >> "$GITHUB_ENV"

      # `--all-targets` проверяет и бенчи (S1-14); их числа — на стенде (docs/perf/).
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Тесты с настоящей корзиной (S5-13) — только на раннере CI: на стенде
      # владельца они клали бы файлы в его корзину.
      - run: cargo nextest run --workspace --locked --profile ci
        env:
          URFIN_TEST_RECYCLE: "1"
      - run: cargo test --doc --workspace --locked

      # Release (fat LTO, ~15 мин) — только на main: в PR хватает clippy и тестов
      # (решение владельца 2026-10-20).
      - name: No diagnostic features in release (profile, dhat-heap, count-alloc)
        if: github.event_name == 'push'
        run: $PY ci/release_features.py
      - if: github.event_name == 'push'
        run: cargo build --release -p urfin-app --locked
      # Бюджет 30 МиБ (S0-decisions №80, растёт вместе с функциями), блокирующий.
      - name: Binary size ≤ 30 MB
        if: github.event_name == 'push'
        run: $PY ci/size.py "$BIN" 30
      - name: Smoke
        if: github.event_name == 'push'
        run: '"$BIN" --smoke'

      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'push'
        with:
          name: urfin-Windows
          path: ${{ env.BIN }}
