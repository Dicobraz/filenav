# cargo-deny: лицензии, advisories, дубли версий, источники (S1 §3, S1-02).

[graph]
all-features = false

[advisories]
yanked = "deny"

[licenses]
# S1 §3 + BSD-3-Clause (S0 v5, «Зависимости и политика»: encoding_rs).
# LicenseRef-UnRAR не добавлять до решения владельца №37.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    # Решение владельца 2026-10-15 (S1-10): `dirs` → `option-ext`. Пофайловый copyleft,
    # используем без изменений.
    "MPL-2.0",
]
confidence-threshold = 0.9
# Список — политика проекта, а не перечень текущих зависимостей.
unused-allowed-license = "allow"
# Шрифты egui по умолчанию (фича `default_fonts`, S1 §3) — только этот крейт.
# S2 заменит их на системные Segoe и вшитый JetBrains Mono.
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
# Дубли версий внутри egui/winit/glutin неизбежны (windows-sys 0.52/0.61, syn 2/3,
# miniz_oxide и десятки на Linux/macOS), поэтому общий запрет — предупреждение
# (видно в логе CI). Жёстко — только для крейтов из S0 v3 №10: версия winit
# ровно та, что тянет eframe, без дубля.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "winit", deny-multiple-versions = true },
    { crate = "egui", deny-multiple-versions = true },
    { crate = "eframe", deny-multiple-versions = true },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
