[package]
name = "urfin-ui"
description = "Urfin egui frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
compact_str.workspace = true
egui.workspace = true
urfin-core.workspace = true
urfin-i18n.workspace = true
urfin-vfs.workspace = true
rustc-hash.workspace = true
serde.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true
tracing.workspace = true

# Даты: на Windows — API ОС (S0-decisions 2026-10-17), иначе jiff по zoneinfo.
[target.'cfg(not(windows))'.dependencies]
jiff.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
insta.workspace = true
toml.workspace = true
tempfile.workspace = true
urfin-core = { workspace = true, features = ["fake"] }

[lints]
workspace = true

[[bench]]
name = "highlight"
harness = false
