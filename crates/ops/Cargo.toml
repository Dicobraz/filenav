[package]
name = "urfin-ops"
description = "Urfin file operations engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
bitflags = { workspace = true, features = ["serde"] }
compact_str = { workspace = true, features = ["serde"] }
crossbeam-channel.workspace = true
serde.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Удаление дерева (S5-09, S0-decisions №58), MIT OR Apache-2.0.
remove_dir_all = "1.0"
# Корзина (S5-13; на Windows — IFileOperation), MIT.
trash = "5.2"
# Журнал job (S5 §6.2): записи `[len][crc32][postcard]`. postcard — MIT OR
# Apache-2.0, crc32fast — MIT OR Apache-2.0 (уже в дереве транзитивно).
crc32fast = "1.4"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }

urfin-core.workspace = true
urfin-i18n.workspace = true
urfin-vfs.workspace = true

# Открытие файлов: ShellExecuteExW (S5 §2.5 `file.open`); копирование и перенос:
# CopyFileExW, MoveFileExW, точки повторной обработки (S5-06).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
insta.workspace = true
remove_dir_all = "1.0"
tempfile.workspace = true
toml.workspace = true
urfin-core = { workspace = true, features = ["fake"] }
urfin-testdata.workspace = true

[lints]
workspace = true
