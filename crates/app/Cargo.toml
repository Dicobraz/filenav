[package]
name = "filenav-app"
description = "FileNav: fast dual-pane file manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "filenav"
path = "src/main.rs"


[dependencies]
anyhow.workspace = true
eframe.workspace = true
# FakeListing: настоящий листинг ФС — S4.
filenav-core = { workspace = true, features = ["fake"] }
filenav-ui.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

# Бэкенды wgpu по ОС (ADR-0012).
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }
# Живой ресайз без дёрганья (presentsWithTransaction): у eframe с
# `wgpu_no_default_features` эта фича egui-wgpu выключена.
egui-wgpu = { workspace = true, features = ["macos-window-resize-jitter-fix"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }

[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "dx12"] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
